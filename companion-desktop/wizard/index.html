<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地伴侣 — 首次设置</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: #141414;
        color: #e8e8e8;
        line-height: 1.5;
        padding: 28px 32px;
        -webkit-user-select: none;
        user-select: none;
      }
      h1 {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 14px;
        font-size: 0.9rem;
        color: #b0b0b0;
      }
      ul {
        margin: 0 0 20px;
        padding-left: 1.2rem;
        font-size: 0.88rem;
        color: #c8c8c8;
      }
      li {
        margin-bottom: 6px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 8px;
      }
      .pairing {
        margin: 14px 0 6px;
        padding: 12px;
        border: 1px solid #2f2f33;
        border-radius: 10px;
        background: #17171b;
      }
      .pairing h3 {
        margin: 0 0 8px;
        font-size: 0.92rem;
      }
      .field {
        margin-bottom: 8px;
      }
      .field label {
        display: block;
        margin-bottom: 4px;
        font-size: 0.78rem;
        color: #a7a7b2;
      }
      .field input {
        width: 100%;
        border: 1px solid #34343a;
        background: #101014;
        color: #e5e7eb;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 0.82rem;
      }
      .hint {
        margin: 8px 0 0;
        font-size: 0.75rem;
        color: #8f95a0;
      }
      button {
        border: 1px solid #333;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 0.9rem;
        cursor: pointer;
        background: #2a2a2a;
        color: #eee;
      }
      button:hover {
        background: #363636;
      }
      button.primary {
        background: #3d5a80;
        border-color: #4a6fa5;
      }
      button.primary:hover {
        background: #4a6fa5;
      }
      label.row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.82rem;
        color: #888;
        margin-top: 4px;
      }
      label.row input {
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <h1>欢迎使用本地伴侣</h1>
    <p>首次在 <strong>Windows</strong> 打开本程序时会出现本页；之后可在托盘菜单点<strong>「首次设置向导」</strong>再看一次。程序会在后台常驻，<strong>左键单击托盘图标</strong>可打开本机管理页，<strong>右键</strong>可打开菜单（含退出）。</p>
    <ul>
      <li>保持本程序运行，网站上的「本机处理」功能才能连到这台电脑。</li>
      <li>若网站提示连不上，请在本页填写<strong>与网站一致的密码</strong>，并填写<strong>允许访问的网站地址</strong>（可留空则使用默认）。</li>
      <li>需要查看任务或文件时，点下方「打开本机管理页」。</li>
    </ul>
    <div class="pairing">
      <h3>与网站保持一致（可选）</h3>
      <div class="field">
        <label for="pair-token">本机通信密码</label>
        <input id="pair-token" type="password" placeholder="在网站「设置 → 本地伴侣」里填写的密码，至少 8 位" />
      </div>
      <div class="field">
        <label for="pair-origin">允许打开的网站地址</label>
        <input id="pair-origin" type="text" placeholder="多个用英文逗号隔开，例如 http://localhost:5173" />
      </div>
      <button type="button" id="save-pairing">保存以上设置</button>
      <p class="hint" id="pairing-hint">修改后请点保存；保存成功后一般无需重启即可生效。</p>
    </div>
    <div class="actions">
      <button type="button" class="primary" id="open-console">打开本机管理页</button>
      <button type="button" id="complete">完成，缩小到托盘</button>
    </div>
    <label class="row">
      <input type="checkbox" id="autostart" disabled />
      开机自动启动本地伴侣（即将支持）
    </label>
    <script>
      const w = window.companionWizard;
      const tokenEl = document.getElementById('pair-token');
      const originEl = document.getElementById('pair-origin');
      const hintEl = document.getElementById('pairing-hint');
      const saveBtn = document.getElementById('save-pairing');

      async function loadPairing() {
        if (!w || !w.loadPairing) return;
        try {
          const cfg = await w.loadPairing();
          tokenEl.value = cfg && typeof cfg.sharedToken === 'string' ? cfg.sharedToken : '';
          originEl.value = cfg && typeof cfg.allowedOrigins === 'string' ? cfg.allowedOrigins : '';
          hintEl.textContent = '已读取本机已保存的设置';
        } catch {
          hintEl.textContent = '读取配置失败';
        }
      }

      saveBtn.addEventListener('click', async () => {
        if (!w || !w.savePairing) return;
        saveBtn.disabled = true;
        hintEl.textContent = '保存中...';
        try {
          const r = await w.savePairing({
            sharedToken: tokenEl.value || '',
            allowedOrigins: originEl.value || '',
          });
          hintEl.textContent = r && r.ok ? '保存成功' : `未能保存：${(r && r.error) || '请稍后重试'}`;
        } catch {
          hintEl.textContent = '保存失败';
        } finally {
          saveBtn.disabled = false;
        }
      });

      document.getElementById('open-console').addEventListener('click', () => {
        if (w) w.openConsole();
      });
      document.getElementById('complete').addEventListener('click', () => {
        if (w) w.complete();
      });
      loadPairing();
    </script>
  </body>
</html>
