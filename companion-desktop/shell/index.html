<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none';" />
  <title>本地伴侣</title>
  <style>
    :root {
      --bg: #0c0c0e;
      --panel: #121214;
      --border: #2e2e32;
      --text: #e4e4e7;
      --muted: #71717a;
      --accent: #3b82f6;
      --ok: #22c55e;
      --warn: #eab308;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    html {
      height: 100%;
      overflow: hidden;
    }
    body {
      margin: 0;
      height: 100%;
      min-height: 100%;
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      padding-top: 30px;
      padding-bottom: 56px;
      overflow: hidden;
    }
    .app-titlebar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(10, 10, 12, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 150;
      -webkit-app-region: drag;
      user-select: none;
    }
    .titlebar-leading {
      display: flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      -webkit-app-region: no-drag;
      padding: 2px 0;
    }
    .titlebar-trailing {
      width: 68px;
      flex-shrink: 0;
    }
    .app-titlebar-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 500;
      color: rgba(228, 228, 231, 0.42);
      letter-spacing: 0.04em;
      pointer-events: none;
    }
    .traffic {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: none;
      padding: 0;
      cursor: pointer;
      flex-shrink: 0;
      opacity: 0.42;
      transition: opacity 0.12s ease, transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.25);
    }
    .app-titlebar:hover .traffic { opacity: 0.92; }
    .traffic:active { transform: scale(0.94); }
    .traffic.close { background: #ff5f57; }
    .traffic.minimize { background: #febc2e; }
    .traffic.zoom { background: #28c840; }
    .traffic.close:hover { box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 95, 87, 0.35); }
    .traffic.minimize:hover { box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(254, 188, 46, 0.35); }
    .traffic.zoom:hover { box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(40, 200, 64, 0.35); }
    .view {
      flex: 1 1 auto;
      min-height: 0;
      padding: 14px 14px 12px 16px;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.18) rgba(255, 255, 255, 0.03);
    }
    .view::-webkit-scrollbar {
      width: 6px;
    }
    .view::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 100px;
      margin: 4px 0;
    }
    .view::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 100px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    .view::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.28);
      background-clip: padding-box;
    }
    .view::-webkit-scrollbar-corner {
      background: transparent;
    }
    .view.hidden { display: none; }
    h1 { margin: 0 0 12px; font-size: 14px; font-weight: 600; letter-spacing: 0; }
    .sub { font-size: 11px; color: var(--muted); margin-bottom: 12px; line-height: 1.45; }
    .status-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .status-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .status-dot.ok { background: var(--ok); box-shadow: 0 0 10px rgba(34,197,94,0.35); }
    .status-dot.warn { background: var(--warn); }
    .status-dot.bad { background: var(--bad); }
    .status-label { font-size: 12px; font-weight: 600; }
    .status-detail { font-size: 10px; color: var(--muted); margin-top: 8px; line-height: 1.45; word-break: break-word; }
    .open-site-btn {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 22px 16px;
      border-radius: 16px;
      border: 1px solid #2563eb;
      background: linear-gradient(180deg, #1e40af 0%, #1d4ed8 100%);
      color: #eff6ff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: filter 0.15s, transform 0.1s;
    }
    .open-site-btn:hover { filter: brightness(1.06); }
    .open-site-btn:active { transform: scale(0.99); }
    .open-site-btn svg { width: 40px; height: 40px; opacity: 0.95; }
    .open-site-btn span { font-size: 11px; font-weight: 600; opacity: 0.85; }
    .hint { font-size: 10px; color: var(--muted); margin-top: 14px; text-align: center; line-height: 1.5; }
    nav.shell-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      display: flex;
      border-top: 1px solid var(--border);
      background: #101012;
      padding: 6px 8px 8px;
      gap: 4px;
      z-index: 100;
    }
    nav.shell-nav button {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      padding: 8px 4px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    nav.shell-nav button.active { color: var(--accent); background: #1a1a1f; }
    nav.shell-nav button:hover { color: var(--text); }
    .ico { font-size: 18px; line-height: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-size: 10px; font-weight: 500; text-transform: none; letter-spacing: 0.02em; }
    .role { color: #a78bfa; font-size: 10px; }
    .health-ok { color: var(--ok); }
    .health-degraded { color: var(--warn); }
    .health-disabled { color: var(--muted); }
    .set-section {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .set-section h3 {
      margin: 0 0 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: none;
      color: rgba(228, 228, 231, 0.5);
    }
    label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; }
    input[type="url"], input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0a0a0b;
      color: var(--text);
      font-size: 12px;
    }
    label.pair-label-gap { margin-top: 10px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .btn {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #18181b;
      color: #d4d4d8;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:hover { background: #222228; }
    .btn-primary { border-color: #2563eb; background: #1d4ed8; color: #eff6ff; }
    .mono { font-family: ui-monospace, monospace; font-size: 10px; color: #cbd5e1; word-break: break-all; }
    .empty { color: var(--muted); font-size: 11px; padding: 16px 0; text-align: center; }
    .storage-hint {
      font-size: 10px;
      color: rgba(148, 163, 184, 0.88);
      line-height: 1.45;
      margin: 0 0 10px;
    }
    h2.section-title {
      margin: 18px 0 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: none;
      color: rgba(228, 228, 231, 0.5);
    }
  </style>
</head>
<body>
  <header class="app-titlebar">
    <div class="titlebar-leading">
      <button type="button" class="traffic close" id="btnTrafficClose" aria-label="关闭" title="关闭"></button>
      <button type="button" class="traffic minimize" id="btnTrafficMin" aria-label="最小化" title="最小化"></button>
      <button type="button" class="traffic zoom" id="btnTrafficZoom" aria-label="最大化" title="最大化"></button>
    </div>
    <div class="app-titlebar-title">本地伴侣</div>
    <div class="titlebar-trailing" aria-hidden="true"></div>
  </header>
  <div id="view-home" class="view">
    <div class="status-card">
      <div class="status-row">
        <div style="display:flex;align-items:center;gap:10px;">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusLabel" class="status-label">…</span>
        </div>
        <span id="portHint" class="mono" style="font-size:10px;color:var(--muted);"></span>
      </div>
      <div id="statusDetail" class="status-detail"></div>
    </div>
    <button type="button" class="open-site-btn" id="btnOpenSite" title="在浏览器中打开">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
      </svg>
      打开网站
      <span id="siteUrlPreview">…</span>
    </button>
    <h2 class="section-title">服务</h2>
    <div class="status-card" style="padding:0;overflow:hidden;">
      <table>
        <thead>
          <tr>
            <th>服务</th>
            <th>类型</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="pluginRows"></tbody>
      </table>
      <p id="pluginsEmpty" class="empty hidden">暂无</p>
    </div>
  </div>

  <div id="view-settings" class="view hidden">
    <h1>设置</h1>
    <div class="set-section">
      <h3>主站</h3>
      <label for="inpSiteUrl">地址</label>
      <input type="url" id="inpSiteUrl" placeholder="https://…" autocomplete="off" />
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="btnSaveSite">保存</button>
      </div>
    </div>
    <div class="set-section">
      <h3>与网站配对</h3>
      <p class="storage-hint">
        保持本程序运行，网站「本机处理」才能连到本机。若提示连不上，请填写与网站一致的密码；允许的网站地址可留空则使用默认。
      </p>
      <label for="inpPairToken">本机通信密码</label>
      <input
        type="password"
        id="inpPairToken"
        placeholder="网站「设置 → 本地伴侣」中的密码，至少 8 位；可不填"
        autocomplete="off"
      />
      <label for="inpPairOrigins" class="pair-label-gap">允许打开的网站地址</label>
      <input
        type="text"
        id="inpPairOrigins"
        placeholder="多个用英文逗号隔开，例如 http://localhost:5173"
        autocomplete="off"
      />
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="btnSavePairing">保存配对设置</button>
      </div>
      <p id="pairingHint" class="mono" style="font-size:10px;color:rgba(148,163,184,0.85);margin-top:8px;line-height:1.4;"></p>
    </div>
    <div class="set-section">
      <h3>存储</h3>
      <p class="storage-hint">
        点击「应用」或「默认」时会询问是否迁移：选「迁移并应用」将把当前存储目录下的数据整体移到新位置（会先短暂停止本机伴侣）；选「仅切换目录」则只改配置，旧目录数据保留在原处。
      </p>
      <label for="inpVolumeRoot">目录</label>
      <div style="display:flex;gap:8px;align-items:stretch;">
        <input type="text" id="inpVolumeRoot" placeholder="默认" autocomplete="off" style="flex:1;" />
        <button type="button" class="btn" id="btnBrowseVolume">浏览</button>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="btnSaveVolume">应用</button>
        <button type="button" class="btn" id="btnClearVolume">默认</button>
      </div>
      <p id="volumeEffective" class="mono" style="font-size:10px;color:rgba(148,163,184,0.85);margin-top:8px;line-height:1.4;"></p>
      <div class="btn-row" style="margin-top:6px;">
        <button type="button" class="btn" id="btnOpenVolumeFolder">打开当前存储文件夹</button>
      </div>
    </div>
    <div class="set-section">
      <h3>本地 API</h3>
      <p id="localBase" class="mono">—</p>
      <div class="btn-row">
        <button type="button" class="btn" id="btnCopyBase">复制</button>
        <button type="button" class="btn" id="btnOpenMgmt">管理页</button>
      </div>
    </div>
  </div>

  <nav class="shell-nav" role="tablist">
    <button type="button" role="tab" data-view="home" class="active" aria-selected="true">
      <span class="ico" aria-hidden="true">⌂</span>
      首页
    </button>
    <button type="button" role="tab" data-view="settings" aria-selected="false">
      <span class="ico" aria-hidden="true">⚙</span>
      设置
    </button>
  </nav>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const shell = window.companionShell;
      if (!shell) {
        document.body.innerHTML = '<p style="padding:24px;color:#f87171;font-size:13px;">请从桌面应用启动。</p>';
        return;
      }

      const defaultSiteUrl =
        typeof shell.defaultSiteUrl === 'string' && shell.defaultSiteUrl.trim()
          ? shell.defaultSiteUrl.trim()
          : 'http://localhost:3000';

      const views = { home: $('view-home'), settings: $('view-settings') };
      let activeView = 'home';
      $('btnTrafficClose').addEventListener('click', () => void shell.closeWindow());
      $('btnTrafficMin').addEventListener('click', () => void shell.minimizeWindow());
      $('btnTrafficZoom').addEventListener('click', () => void shell.toggleMaximize());

      document.querySelectorAll('nav.shell-nav button').forEach((btn) => {
        btn.addEventListener('click', () => {
          const v = btn.getAttribute('data-view');
          activeView = v || 'home';
          document.querySelectorAll('nav.shell-nav button').forEach((b) => {
            const on = b.getAttribute('data-view') === v;
            b.classList.toggle('active', on);
            b.setAttribute('aria-selected', on ? 'true' : 'false');
          });
          Object.keys(views).forEach((k) => views[k].classList.toggle('hidden', k !== v));
          if (v === 'home') void loadPlugins();
          if (v === 'settings') {
            void refreshVolumeEffectiveHint();
            void loadPairingFields();
          }
        });
      });

      let settingsCache = { siteUrl: defaultSiteUrl, volumeRoot: '' };
      let pluginListSignature = '';
      let pluginLoading = false;

      async function loadSettingsUi() {
        const s = await shell.loadSettings();
        if (s && typeof s.siteUrl === 'string' && s.siteUrl.trim()) settingsCache.siteUrl = s.siteUrl.trim();
        settingsCache.volumeRoot = s && typeof s.volumeRoot === 'string' ? s.volumeRoot.trim() : '';
        $('inpSiteUrl').value = settingsCache.siteUrl;
        $('siteUrlPreview').textContent = settingsCache.siteUrl;
        $('inpVolumeRoot').value = settingsCache.volumeRoot;
      }

      async function loadPairingFields() {
        const hintEl = $('pairingHint');
        if (!hintEl || !shell.loadPairing) return;
        try {
          const cfg = await shell.loadPairing();
          $('inpPairToken').value = cfg && typeof cfg.sharedToken === 'string' ? cfg.sharedToken : '';
          $('inpPairOrigins').value =
            cfg && typeof cfg.allowedOrigins === 'string' ? cfg.allowedOrigins : '';
          hintEl.textContent = '已读取本机已保存的配对设置';
        } catch {
          hintEl.textContent = '读取配对配置失败';
        }
      }

      async function refreshVolumeEffectiveHint() {
        const el = $('volumeEffective');
        if (!el) return;
        try {
          const r = await shell.api('GET', '/v1/runtime-status', null);
          const root = r && r.ok && r.json && r.json.repository && r.json.repository.rootAbsolutePath;
          el.textContent = root ? String(root) : '';
        } catch {
          el.textContent = '';
        }
      }

      function setStatusFromTray(sum) {
        const dot = $('statusDot');
        const label = $('statusLabel');
        const detail = $('statusDetail');
        const portEl = $('portHint');
        const err = sum && sum.lastError ? String(sum.lastError) : '';
        const note = sum && sum.note ? String(sum.note) : '—';
        portEl.textContent = sum && sum.port ? ':' + sum.port : '';
        detail.textContent = err || '';
        if (!sum || sum.connected === false) {
          dot.className = 'status-dot bad';
          label.textContent = '未连接';
          return;
        }
        if (err && (err.includes('relay') || err.includes('site') || err.includes('token'))) {
          dot.className = 'status-dot warn';
          label.textContent = note;
          return;
        }
        dot.className = 'status-dot ok';
        label.textContent = note;
      }

      async function refreshTray() {
        try {
          const sum = await shell.traySummary();
          setStatusFromTray(sum);
        } catch (e) {
          setStatusFromTray({ connected: false, note: '状态异常', lastError: String(e), port: null });
        }
      }

      async function loadPlugins() {
        if (pluginLoading) return;
        pluginLoading = true;
        const tbody = $('pluginRows');
        const empty = $('pluginsEmpty');
        let r;
        try {
          r = await shell.api('GET', '/v1/capabilities', null);
        } catch (e) {
          empty.textContent = '加载失败';
          empty.classList.remove('hidden');
          pluginLoading = false;
          return;
        }
        if (!r.ok || !r.json || !Array.isArray(r.json.plugins)) {
          if (r && r.status === 401) empty.textContent = '验证失败';
          else if (r && r.status != null) empty.textContent = '加载失败 · ' + r.status;
          else empty.textContent = '加载失败';
          empty.classList.remove('hidden');
          pluginLoading = false;
          return;
        }
        const normalizedPlugins = r.json.plugins.map((p) => ({
          displayName: p.displayName || p.id || '—',
          sub: [p.id, p.semver].filter(Boolean).join(' · '),
          role: p.role || '—',
          health: p.health || '—',
        }));
        const nextSignature = JSON.stringify(normalizedPlugins);
        if (nextSignature === pluginListSignature && empty.classList.contains('hidden')) {
          pluginLoading = false;
          return;
        }
        pluginListSignature = nextSignature;
        empty.classList.add('hidden');
        tbody.innerHTML = '';
        const fragment = document.createDocumentFragment();
        for (const p of normalizedPlugins) {
          const tr = document.createElement('tr');
          const h = p.health === 'ok' ? 'health-ok' : p.health === 'degraded' ? 'health-degraded' : 'health-disabled';
          tr.innerHTML =
            '<td><div style="font-weight:700;">' +
            p.displayName +
            '</div><div style="font-size:10px;color:#71717a;margin-top:4px;">' +
            p.sub.replace(/</g, '&lt;') +
            '</div></td>' +
            '<td><span class="role">' +
            p.role +
            '</span></td>' +
            '<td class="' +
            h +
            '">' +
            p.health +
            '</td>';
          fragment.appendChild(tr);
        }
        tbody.appendChild(fragment);
        pluginLoading = false;
      }

      $('btnOpenSite').addEventListener('click', async () => {
        const url = settingsCache.siteUrl || $('inpSiteUrl').value.trim() || defaultSiteUrl;
        await shell.openWebsite(url);
      });

      $('btnSaveSite').addEventListener('click', async () => {
        const u = $('inpSiteUrl').value.trim();
        const res = await shell.saveSettings({ siteUrl: u });
        if (res && res.ok) {
          settingsCache.siteUrl = u || settingsCache.siteUrl;
          $('siteUrlPreview').textContent = settingsCache.siteUrl;
        }
      });

      $('btnBrowseVolume').addEventListener('click', async () => {
        try {
          const r = await shell.pickVolumeRoot();
          if (r && r.ok && r.path) $('inpVolumeRoot').value = r.path;
        } catch (e) {
          $('volumeEffective').textContent = '';
        }
      });

      $('btnSaveVolume').addEventListener('click', async () => {
        const v = $('inpVolumeRoot').value.trim();
        let oldRoot = '';
        try {
          const r = await shell.api('GET', '/v1/runtime-status', null);
          if (r.ok && r.json && r.json.repository && r.json.repository.rootAbsolutePath) {
            oldRoot = String(r.json.repository.rootAbsolutePath);
          }
        } catch {
          /* ignore */
        }
        try {
          const res = await shell.applyVolumeChange({ newVolumeRoot: v, oldVolumeRoot: oldRoot });
          if (res && res.canceled) return;
          if (!res || !res.ok) return;
          settingsCache.volumeRoot = v;
          if (res.noChange) {
            setTimeout(() => void refreshVolumeEffectiveHint(), 800);
            return;
          }
          $('volumeEffective').textContent = '';
          setTimeout(() => void refreshVolumeEffectiveHint(), 800);
        } catch (e) {
          $('volumeEffective').textContent = e instanceof Error ? e.message : String(e);
        }
      });

      $('btnClearVolume').addEventListener('click', async () => {
        let oldRoot = '';
        try {
          const r = await shell.api('GET', '/v1/runtime-status', null);
          if (r.ok && r.json && r.json.repository && r.json.repository.rootAbsolutePath) {
            oldRoot = String(r.json.repository.rootAbsolutePath);
          }
        } catch {
          /* ignore */
        }
        try {
          const res = await shell.applyVolumeChange({ newVolumeRoot: '', oldVolumeRoot: oldRoot });
          if (res && res.canceled) return;
          if (!res || !res.ok) return;
          settingsCache.volumeRoot = '';
          $('inpVolumeRoot').value = '';
          if (res.noChange) {
            setTimeout(() => void refreshVolumeEffectiveHint(), 800);
            return;
          }
          $('volumeEffective').textContent = '';
          setTimeout(() => void refreshVolumeEffectiveHint(), 800);
        } catch (e) {
          $('volumeEffective').textContent = e instanceof Error ? e.message : String(e);
        }
      });

      $('btnOpenVolumeFolder').addEventListener('click', async () => {
        let p = '';
        try {
          const r = await shell.api('GET', '/v1/runtime-status', null);
          if (r.ok && r.json && r.json.repository && r.json.repository.rootAbsolutePath) {
            p = String(r.json.repository.rootAbsolutePath);
          }
        } catch {
          /* ignore */
        }
        if (!p.trim()) {
          const manual = $('inpVolumeRoot').value.trim();
          if (manual) p = manual;
        }
        if (!p.trim()) return;
        try {
          await shell.openFolderPath(p);
        } catch {
          /* ignore */
        }
      });

      $('btnCopyBase').addEventListener('click', async () => {
        const sum = await shell.traySummary();
        const port = sum && sum.port ? sum.port : 18765;
        shell.copyText('http://127.0.0.1:' + port + '/');
      });

      $('btnOpenMgmt').addEventListener('click', () => shell.openManagementBrowser());

      $('btnSavePairing').addEventListener('click', async () => {
        const hintEl = $('pairingHint');
        const btn = $('btnSavePairing');
        if (!shell.savePairing) return;
        btn.disabled = true;
        hintEl.textContent = '保存中…';
        try {
          const r = await shell.savePairing({
            sharedToken: $('inpPairToken').value || '',
            allowedOrigins: $('inpPairOrigins').value || '',
          });
          hintEl.textContent =
            r && r.ok ? '保存成功，一般无需重启即可生效' : '未能保存：' + ((r && r.error) || '请稍后重试');
        } catch {
          hintEl.textContent = '保存失败';
        } finally {
          btn.disabled = false;
        }
      });

      async function refreshHome() {
        await refreshTray();
        if (activeView === 'home') {
          await loadPlugins();
        }
      }

      async function init() {
        $('statusLabel').textContent = '连接中…';
        $('siteUrlPreview').textContent = settingsCache.siteUrl;
        try {
          await Promise.race([
            loadSettingsUi(),
            new Promise((_, rej) => setTimeout(() => rej(new Error('loadSettings 超时')), 8000)),
          ]);
        } catch {
          $('inpSiteUrl').value = settingsCache.siteUrl;
          $('siteUrlPreview').textContent = settingsCache.siteUrl;
          $('inpVolumeRoot').value = settingsCache.volumeRoot;
        }
        try {
          const sum = await shell.traySummary();
          $('localBase').textContent = 'http://127.0.0.1:' + (sum && sum.port ? sum.port : 18765) + '/';
        } catch {
          $('localBase').textContent = 'http://127.0.0.1:18765/';
        }
        try {
          await refreshHome();
        } catch (e) {
          setStatusFromTray({ connected: false, note: '异常', lastError: String(e && e.message ? e.message : e), port: null });
        }
        void refreshVolumeEffectiveHint();
        setInterval(() => {
          void refreshHome().catch(() => {});
        }, 10000);
      }

      void init();
    })();
  </script>
</body>
</html>
