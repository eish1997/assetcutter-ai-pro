services:
  # Gemini 异步代理（无 --env-file；密钥与 CORS 在 Dashboard 配置）
  - type: web
    name: assetcutter-gemini-proxy
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run start:gemini-proxy
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      # 逗号分隔；须含所有前端 Origin（如 app.adrazzo.com、assetcutter-web.onrender.com、*.vercel.app 预览需逐条或 Dashboard 用 * 排障）
      - key: PROXY_ALLOWED_ORIGINS
        sync: false
      # Vertex（设置页选 Vertex 时必填，与前端 VITE_BULK_IMAGE_API 指向的**本服务**一致）
      - key: VERTEX_PROJECT_ID
        sync: false
      - key: VERTEX_LOCATION
        value: global
      # 服务账号 JSON：Dashboard 粘贴整段 JSON 到 GOOGLE_APPLICATION_CREDENTIALS_JSON（或本机路径式 GOOGLE_APPLICATION_CREDENTIALS）
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      # 可选：GEMINI_API_KEYS、ENABLE_TOAPIS_FALLBACK、TOAPIS_API_KEY 等，见 README 与 docs/VERTEX_AI_INTEGRATION.md

  - type: web
    name: assetcutter-auth-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run start:auth-backend
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_BIND_HOST
        value: 0.0.0.0
      - key: AUTH_SESSION_TTL_MS
        value: 604800000
      - key: AUTH_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_ADMIN_EMAIL
        sync: false
      - key: AUTH_ADMIN_PASSWORD
        sync: false
      - key: AUTH_ADMIN_USERNAME
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: assetcutter-auth-db
          property: connectionString
      # 工作区云同步（R2）：与 auth 同源挂载 /api/r2，无需单独 R2 服务
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: PROXY_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: assetcutter-web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # 与 auth 不同源时构建期必填，否则能力预览仍请求静态站 /api/r2（易回退成 index.html →「预览不可用」）
      - key: VITE_AUTH_API_BASE_URL
        sync: false
      # 与 auth 同源时可不填；仅当 R2 单独域名部署时再设
      - key: VITE_R2_API_BASE_URL
        sync: false
      # 试用 / 官方 Gemini 走后端代理；须与 gemini-proxy 上 GEMINI_API_KEY、PROXY_ALLOWED_ORIGINS 一致
      - key: VITE_BULK_IMAGE_API
        value: https://assetcutter-gemini-proxy.onrender.com
      # Vertex 专用（可与上一项相同）；构建产物需含 geminiService 对 VITE_BULK_IMAGE_API_VERTEX 的支持
      - key: VITE_BULK_IMAGE_API_VERTEX
        value: https://assetcutter-gemini-proxy.onrender.com

databases:
  - name: assetcutter-auth-db
    databaseName: assetcutter_auth
    user: assetcutter_auth_user
    plan: free

