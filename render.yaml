services:
  # 瀹樻柟 Render 鏈嶅姟浠呮涓夐」锛堝嬁鍐嶅垱寤轰笌浠撳簱鍚屽悕鐨?assetcutter-ai-pro Web 鏈嶅姟锛屼細鏃?start 鑴氭湰瀵艰嚧 Port scan 澶辫触锛?
  # Gemini 寮傛浠ｇ悊锛堟棤 --env-file锛涘瘑閽ヤ笌 CORS 鍦?Dashboard 閰嶇疆锛?
  - type: web
    name: assetcutter-ai-worker-proxy
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run start:ai-worker-proxy
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      # 鍏钩鎺掗槦鎬诲紑鍏筹紙鏁板€兼棆閽湪绠＄悊椤?/admin/gemini-fairness 鍐欏叆 Postgres锛屼笌 auth-api 鍏变韩锛?
      - key: GEMINI_FAIRNESS_ENABLED
        value: "true"
      - key: GEMINI_FAIRNESS_CONFIG_SOURCE
        value: db
      - key: DATABASE_URL
        fromDatabase:
          name: assetcutter-auth-db
          property: connectionString
      # 娴忚鍣ㄧ洿杩炴湰浠ｇ悊鏃舵帴鍙楃櫥褰曟€?X-AC-Fairness-Key锛堝叕缃戞棤 HMAC 鏃剁殑鐢熶骇榛樿锛?
      - key: GEMINI_FAIRNESS_TRUST_CLIENT_KEY_HEADER
        value: "true"
      # 閫楀彿鍒嗛殧锛涗笌 BUILTIN_PROXY_ALLOWED_ORIGINS锛堝惈 app.adrazzo.com 绛夛級鍚堝苟锛屽嬁鍙厤 Vercel 婕忚嚜瀹氫箟鍩?
      - key: PROXY_ALLOWED_ORIGINS
        sync: false
      # Vertex锛堣缃〉閫?Vertex 鏃跺繀濉紝涓庡墠绔?VITE_AI_WORKER_PROXY_API 鎸囧悜鐨?*鏈湇鍔?*涓€鑷达級
      - key: VERTEX_PROJECT_ID
        sync: false
      # Vertex锛氬繀椤?us-central1锛圓gent Platform 鍖哄煙绔偣锛夈€傚嬁璁?global鈥斺€斾細璧?aiplatform.googleapis.com锛?
      # Console 璁″叆銆孏emini for Google Cloud API銆嶄笖涓庡尯鍩熼厤棰濆垎绂汇€侱ashboard 鑻ヤ粛涓?global锛孲ync Blueprint 鎴栨墜鍔ㄦ敼鍚?redeploy銆?
      - key: VERTEX_LOCATION
        value: us-central1
      # 涓?VERTEX_LOCATION 瀵归綈锛涜嫢 Dashboard 鏇惧崟鐙 GOOGLE_CLOUD_LOCATION=global 浼氳鐩栦笂闈㈤粯璁わ紝鏁呮樉寮忛拤姝?
      - key: GOOGLE_CLOUD_LOCATION
        value: us-central1
      # Agent Platform 鐢熷浘 REST 鐢?v1
      - key: VERTEX_API_VERSION
        value: v1
      # 鏈嶅姟璐﹀彿 JSON锛欴ashboard 绮樿创鏁存 JSON 鍒?GOOGLE_APPLICATION_CREDENTIALS_JSON锛堟垨鏈満璺緞寮?GOOGLE_APPLICATION_CREDENTIALS锛?
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      # 鍙€夛細GEMINI_API_KEYS銆丒NABLE_TOAPIS_FALLBACK銆乀OAPIS_API_KEY 绛夛紝瑙?README 涓?docs/VERTEX_AI_INTEGRATION.md
      # 涓?auth-api INTERNAL_API_SECRET 鐩稿悓锛沢emini-proxy 鏍￠獙娴忚鍣?X-AC-Credits-Reserve 鏃跺洖璋?auth-api
      - key: AI_WORKER_PROXY_CREDITS_INTERNAL_SECRET
        sync: false
      - key: AUTH_API_BASE
        value: https://assetcutter-auth-api.onrender.com
      # AI Gateway image execution gray gate; kept in proxy healthz for deployment verification.
      - key: AI_GATEWAY_EXECUTION_ENABLED
        value: "true"

  - type: web
    name: assetcutter-auth-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run start:auth-backend
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_BIND_HOST
        value: 0.0.0.0
      - key: AUTH_SESSION_TTL_MS
        value: 604800000
      - key: AUTH_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: AUTH_COOKIE_SECURE
        value: "true"
      # 閭€璇峰埗娉ㄥ唽锛氶』绠＄悊绔敓鎴愮殑涓€娆℃€х爜 AC-XXXX-XXXX 鎴栭摼鎺??invite=
      - key: REGISTRATION_MODE
        value: invite_only
      - key: AUTH_ADMIN_EMAIL
        sync: false
      - key: AUTH_ADMIN_PASSWORD
        sync: false
      - key: AUTH_ADMIN_USERNAME
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: assetcutter-auth-db
          property: connectionString
      # Dashboard pulls AI Worker Proxy health.
      - key: AI_WORKER_PROXY_HEALTH_URL
        value: https://assetcutter-ai-worker-proxy.onrender.com
      # auth-api proxy relay upstream.
      - key: AI_WORKER_PROXY_UPSTREAM_URL
        value: https://assetcutter-ai-worker-proxy.onrender.com
      # AI Gateway execution handoff: /api/ai/jobs can submit image/text jobs to AI Worker Proxy.
      - key: AI_GATEWAY_EXECUTION_ENABLED
        value: "true"
      # 宸ヤ綔鍖轰簯鍚屾锛圧2锛夛細涓?auth 鍚屾簮鎸傝浇 /api/r2锛屾棤闇€鍗曠嫭 R2 鏈嶅姟
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # 浼翠荆瀹夎鍖?鎵╁睍鍖呭叕缃戠洿閾句笌 electron-updater YAML锛涙湭璁炬椂鍥為€€ R2_PUBLIC_BASE_URL
      - key: COMPANION_DIST_PUBLIC_HTTP_BASE
        sync: false
      - key: PROXY_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: assetcutter-web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # 涓?auth 涓嶅悓婧愭椂鏋勫缓鏈熷繀濉紱鐢熷浘缁?/api/ai-worker-proxy 涓户锛岄伩鍏嶆祻瑙堝櫒鐩磋繛 onrender 澶辫触
      - key: VITE_AUTH_API_BASE_URL
        value: https://assetcutter-auth-api.onrender.com
      # 涓?auth 鍚屾簮鏃跺彲涓嶅～锛涗粎褰?R2 鍗曠嫭鍩熷悕閮ㄧ讲鏃跺啀璁?
      - key: VITE_R2_API_BASE_URL
        sync: false
      # AI Worker Proxy root.
      - key: VITE_AI_WORKER_PROXY_API
        value: https://assetcutter-ai-worker-proxy.onrender.com
      # Vertex-specific AI Worker Proxy root.
      - key: VITE_AI_WORKER_PROXY_API_VERTEX
        value: https://assetcutter-ai-worker-proxy.onrender.com
      # Shared account: keep browser-side concurrency conservative.
      - key: VITE_WORKFLOW_MAX_CONCURRENCY
        value: "2"
      - key: VITE_GEMINI_IMAGE_BATCH_BOX_SIZE_VERTEX
        value: "2"
      # Frontend gray gate: Vertex image jobs try /api/ai/jobs first, then use AI Worker Proxy execution.
      - key: VITE_AI_GATEWAY_IMAGE_EXECUTION
        value: vertex

databases:
  - name: assetcutter-auth-db
    databaseName: assetcutter_auth
    user: assetcutter_auth_user
    plan: free

