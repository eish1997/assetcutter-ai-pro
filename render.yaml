services:
  # 官方 Render 服务仅此三项（勿再创建与仓库同名的 assetcutter-ai-pro Web 服务，会无 start 脚本导致 Port scan 失败）
  # Gemini 异步代理（无 --env-file；密钥与 CORS 在 Dashboard 配置）
  - type: web
    name: assetcutter-gemini-proxy
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run start:gemini-proxy
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      # 公平排队总开关（数值旋钮在管理页 /admin/gemini-fairness 写入 Postgres，与 auth-api 共享）
      - key: GEMINI_FAIRNESS_ENABLED
        value: "true"
      - key: GEMINI_FAIRNESS_CONFIG_SOURCE
        value: db
      - key: DATABASE_URL
        fromDatabase:
          name: assetcutter-auth-db
          property: connectionString
      # 浏览器直连本代理时接受登录态 X-AC-Fairness-Key（公网无 HMAC 时的生产默认）
      - key: GEMINI_FAIRNESS_TRUST_CLIENT_KEY_HEADER
        value: "true"
      # 逗号分隔；与 BUILTIN_PROXY_ALLOWED_ORIGINS（含 app.adrazzo.com 等）合并，勿只配 Vercel 漏自定义域
      - key: PROXY_ALLOWED_ORIGINS
        sync: false
      # Vertex（设置页选 Vertex 时必填，与前端 VITE_BULK_IMAGE_API 指向的**本服务**一致）
      - key: VERTEX_PROJECT_ID
        sync: false
      - key: VERTEX_LOCATION
        value: global
      # 服务账号 JSON：Dashboard 粘贴整段 JSON 到 GOOGLE_APPLICATION_CREDENTIALS_JSON（或本机路径式 GOOGLE_APPLICATION_CREDENTIALS）
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      # 可选：GEMINI_API_KEYS、ENABLE_TOAPIS_FALLBACK、TOAPIS_API_KEY 等，见 README 与 docs/VERTEX_AI_INTEGRATION.md
      # 与 auth-api INTERNAL_API_SECRET 相同；gemini-proxy 校验浏览器 X-AC-Credits-Reserve 时回调 auth-api
      - key: GEMINI_PROXY_CREDITS_INTERNAL_SECRET
        sync: false
      - key: AUTH_API_BASE
        value: https://assetcutter-auth-api.onrender.com

  - type: web
    name: assetcutter-auth-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run start:auth-backend
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_BIND_HOST
        value: 0.0.0.0
      - key: AUTH_SESSION_TTL_MS
        value: 604800000
      - key: AUTH_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: AUTH_COOKIE_SECURE
        value: "true"
      # 邀请制注册：须管理端生成的一次性码 AC-XXXX-XXXX 或链接 ?invite=
      - key: REGISTRATION_MODE
        value: invite_only
      - key: AUTH_ADMIN_EMAIL
        sync: false
      - key: AUTH_ADMIN_PASSWORD
        sync: false
      - key: AUTH_ADMIN_USERNAME
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: assetcutter-auth-db
          property: connectionString
      # Dashboard 拉取 gemini-proxy /healthz.fairness（勿浏览器直打 proxy）
      - key: GEMINI_PROXY_HEALTH_URL
        value: https://assetcutter-gemini-proxy.onrender.com
      # auth-api /api/gemini-proxy/* 转发目标（默认同 HEALTH_URL）
      - key: GEMINI_PROXY_UPSTREAM_URL
        value: https://assetcutter-gemini-proxy.onrender.com
      # 工作区云同步（R2）：与 auth 同源挂载 /api/r2，无需单独 R2 服务
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # 伴侣安装包/扩展包公网直链与 electron-updater YAML；未设时回退 R2_PUBLIC_BASE_URL
      - key: COMPANION_DIST_PUBLIC_HTTP_BASE
        sync: false
      - key: PROXY_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: assetcutter-web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # 与 auth 不同源时构建期必填；生图经 /api/gemini-proxy 中继，避免浏览器直连 onrender 失败
      - key: VITE_AUTH_API_BASE_URL
        value: https://assetcutter-auth-api.onrender.com
      # 与 auth 同源时可不填；仅当 R2 单独域名部署时再设
      - key: VITE_R2_API_BASE_URL
        sync: false
      # 试用 / 官方 Gemini 走后端代理；须与 gemini-proxy 上 GEMINI_API_KEY、PROXY_ALLOWED_ORIGINS 一致
      - key: VITE_BULK_IMAGE_API
        value: https://assetcutter-gemini-proxy.onrender.com
      # Vertex 专用（可与上一项相同）；构建产物需含 geminiService 对 VITE_BULK_IMAGE_API_VERTEX 的支持
      - key: VITE_BULK_IMAGE_API_VERTEX
        value: https://assetcutter-gemini-proxy.onrender.com
      # 20 人共享单账号：降低浏览器侧并发尖峰
      - key: VITE_WORKFLOW_MAX_CONCURRENCY
        value: "2"
      - key: VITE_GEMINI_IMAGE_BATCH_BOX_SIZE_VERTEX
        value: "2"

databases:
  - name: assetcutter-auth-db
    databaseName: assetcutter_auth
    user: assetcutter_auth_user
    plan: free

