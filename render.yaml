services:
  - type: web
    name: assetcutter-auth-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: npm run dev:auth-backend
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_BIND_HOST
        value: 0.0.0.0
      - key: AUTH_SESSION_TTL_MS
        value: 604800000
      - key: AUTH_ADMIN_EMAIL
        sync: false
      - key: AUTH_ADMIN_PASSWORD
        sync: false
      - key: AUTH_ADMIN_USERNAME
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: assetcutter-auth-db
          property: connectionString

  - type: web
    name: assetcutter-web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_AUTH_API_BASE_URL
        sync: false

databases:
  - name: assetcutter-auth-db
    databaseName: assetcutter_auth
    user: assetcutter_auth_user
    plan: free

