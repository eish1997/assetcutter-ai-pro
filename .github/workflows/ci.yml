# 质量门禁：含「审计 + Overlay 环」单测（见 docs/工作流步骤时间线审计与Overlay快照.md §14）
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Workflow rings (audit + overlay IDB / hydrate)
        run: npm run test:workflow-rings

      - name: ESLint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: SamLocal OpenAPI (Spectral)
        run: npm run lint:openapi

      - name: local-companion typecheck
        working-directory: local-companion
        run: |
          npm ci
          npm run typecheck

      - name: script-hub typecheck
        working-directory: script-hub
        run: |
          npm ci
          npm run typecheck

      - name: Storage / persistence guards
        run: npm run guard:storage

      - name: Production build
        run: npm run build
