# 质量门禁：含「审计 + Overlay 环」单测（见 docs/工作流步骤时间线审计与Overlay快照.md §14）
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Workflow rings (audit + overlay IDB / hydrate)
        run: npm run test:workflow-rings

      - name: Credits billing (store + consume + gate)
        run: npm run test:credits

      - name: Credits reconcile (dry run)
        run: npm run credits:reconcile
        continue-on-error: false

      - name: ESLint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: SamLocal OpenAPI (Spectral)
        run: npm run lint:openapi

      - name: local-companion typecheck
        working-directory: local-companion
        run: |
          npm ci
          npm run typecheck

      - name: script-hub typecheck
        working-directory: script-hub
        run: |
          npm ci
          npm run typecheck

      - name: Storage / persistence guards
        run: npm run guard:storage

      - name: False-green Vite env guard (C4)
        run: npm run guard:false-green

      - name: Production build
        run: npm run build

      # D1: optional dry-run only — never treat as pre-release green (summary says UNTESTED/DRY-RUN).
      - name: AI Gateway smoke matrix (optional dry-run; not pre-release green)
        env:
          AI_GATEWAY_SMOKE_OPTIONAL: '1'
          ADMIN_IDENTIFIER: ${{ secrets.ADMIN_IDENTIFIER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          AUTH_API_BASE: ${{ vars.AUTH_API_BASE }}
          ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
        run: |
          npm run smoke:ai-gateway-matrix -- --dry-run
          echo "::notice title=AI Gateway smoke::Dry-run/optional matrix is NOT a pre-release pass (see job summary)."
