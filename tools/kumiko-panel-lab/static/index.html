<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kumiko 分格实验室</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --panel: #141414;
        --border: #2a2a2a;
        --text: #e8e8e8;
        --muted: #888;
        --accent: #3b82f6;
        --ok: #22c55e;
        --err: #ef4444;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 20px 48px;
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 600;
        margin: 0 0 6px;
      }
      .sub {
        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 20px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      input[type="file"] {
        font-size: 0.85rem;
      }
      input[type="number"] {
        width: 72px;
        background: #0f0f0f;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 6px;
        padding: 6px 8px;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 0.9rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .status {
        font-size: 0.85rem;
        min-height: 1.2em;
      }
      .status.err {
        color: var(--err);
      }
      .status.ok {
        color: var(--ok);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 280px;
        gap: 16px;
      }
      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .preview {
        width: 100%;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #000;
        display: block;
      }
      .panel-list {
        max-height: 70vh;
        overflow: auto;
        font-size: 0.82rem;
      }
      .panel-item {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 8px;
      }
      .panel-item strong {
        color: var(--accent);
      }
      pre {
        margin: 8px 0 0;
        padding: 10px;
        background: #0f0f0f;
        border-radius: 8px;
        overflow: auto;
        font-size: 0.75rem;
        max-height: 200px;
      }
      .drop {
        border: 1px dashed #444;
        border-radius: 10px;
        padding: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Kumiko 分格实验室</h1>
      <p class="sub">
        上传分镜拼图测试分格。Kumiko 仅适合<strong>清晰黑框漫画格</strong>；影视分镜表请用
        <strong>自动（推荐）</strong>或<strong>均匀网格 + 列×行</strong>。
      </p>

      <div class="card">
        <div class="drop" id="dropZone">拖拽图片到此处，或下方选择文件</div>
        <div class="row" style="margin-top: 12px">
          <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/bmp" />
          <label
            >模式
            <select id="mode" style="background:#0f0f0f;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px">
              <option value="auto" selected>自动（Kumiko → 分隔线 → 均匀网格）</option>
              <option value="grid">分隔线网格</option>
              <option value="uniform">均匀网格（须填列×行）</option>
              <option value="kumiko">仅 Kumiko</option>
            </select>
          </label>
          <label
            >列
            <input type="number" id="gridCols" min="1" max="12" placeholder="3" style="width:52px" />
          </label>
          <label
            >行
            <input type="number" id="gridRows" min="1" max="12" placeholder="2" style="width:52px" />
          </label>
          <label><input type="checkbox" id="rtl" /> RTL</label>
          <label><input type="checkbox" id="panelExpansion" checked /> expansion</label>
          <button id="runBtn" disabled>检测分格</button>
        </div>
        <p style="font-size:0.78rem;color:var(--muted);margin:8px 0 0">
          只识别到 1 整格时：填写与实际拼图一致的<strong>列×行</strong>（如 3×2），模式选「均匀网格」或「自动」。
        </p>
        <p class="status" id="status"></p>
      </div>

      <div class="grid" id="resultGrid" hidden>
        <div class="card">
          <img id="preview" class="preview" alt="overlay preview" />
        </div>
        <div class="card">
          <div><strong id="summary"></strong></div>
          <div class="panel-list" id="panelList"></div>
          <pre id="jsonOut"></pre>
        </div>
      </div>
    </div>

    <script>
      const fileInput = document.getElementById('fileInput');
      const runBtn = document.getElementById('runBtn');
      const statusEl = document.getElementById('status');
      const preview = document.getElementById('preview');
      const resultGrid = document.getElementById('resultGrid');
      const panelList = document.getElementById('panelList');
      const jsonOut = document.getElementById('jsonOut');
      const summary = document.getElementById('summary');
      const dropZone = document.getElementById('dropZone');

      let selectedFile = null;

      function setStatus(msg, kind) {
        statusEl.textContent = msg || '';
        statusEl.className = 'status' + (kind ? ' ' + kind : '');
      }

      function pickFile(file) {
        if (!file || !file.type.startsWith('image/')) {
          setStatus('请选择图片文件', 'err');
          return;
        }
        selectedFile = file;
        runBtn.disabled = false;
        setStatus(`已选择: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`, 'ok');
      }

      fileInput.addEventListener('change', () => pickFile(fileInput.files[0]));
      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#3b82f6';
      });
      dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = '#444';
      });
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#444';
        pickFile(e.dataTransfer.files[0]);
      });

      runBtn.addEventListener('click', async () => {
        if (!selectedFile) return;
        runBtn.disabled = true;
        setStatus('检测中…');
        const fd = new FormData();
        fd.append('file', selectedFile);
        fd.append('mode', document.getElementById('mode').value);
        fd.append('grid_cols', document.getElementById('gridCols').value.trim());
        fd.append('grid_rows', document.getElementById('gridRows').value.trim());
        fd.append('rtl', document.getElementById('rtl').checked ? 'true' : 'false');
        fd.append('panel_expansion', document.getElementById('panelExpansion').checked ? 'true' : 'false');

        try {
          const res = await fetch('/api/detect', { method: 'POST', body: fd });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || res.statusText);
          preview.src = 'data:image/jpeg;base64,' + data.overlayJpegBase64;
          const engine = data.engine || '?';
          const fb = data.fallback ? ` · fallback: ${data.fallback}` : '';
          const warn = data.warn ? `\n⚠ ${data.warn}` : '';
          summary.textContent = `${data.panelCount} 格 · ${engine}${fb} · ${data.elapsedMs} ms · ${data.size?.[0]}×${data.size?.[1]} px${warn}`;
          panelList.innerHTML = (data.panels || [])
            .map(
              (p, i) =>
                `<div class="panel-item"><strong>#${i + 1}</strong> x=${p[0]} y=${p[1]} w=${p[2]} h=${p[3]}</div>`
            )
            .join('');
          jsonOut.textContent = JSON.stringify(data, null, 2);
          resultGrid.hidden = false;
          setStatus('完成', 'ok');
        } catch (e) {
          setStatus(e.message || String(e), 'err');
        } finally {
          runBtn.disabled = !selectedFile;
        }
      });

      fetch('/health')
        .then((r) => r.json())
        .then((h) => {
          if (!h.ok) setStatus(h.error || 'Kumiko 未就绪', 'err');
        })
        .catch(() => setStatus('无法连接服务，请先 npm run dev:kumiko-panel-lab', 'err'));
    </script>
  </body>
</html>
